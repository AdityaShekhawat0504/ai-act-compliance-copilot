[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-act-compliance-copilot"
version = "0.1.0"
description = "EU AI Act Annex IV technical documentation generator from MLOps artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub",
    "instructor",
    "openai",
    "pydantic>=2.0",
    "pyyaml",
    "reportlab",
    "typer",
]

[project.scripts]
compliance-copilot = "cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/annex_iv", "src/ingestion", "src/extraction", "src/gap_analysis", "src/output", "src"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
