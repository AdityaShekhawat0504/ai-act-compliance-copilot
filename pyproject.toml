[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-act-compliance-copilot"
version = "0.1.0"
description = "EU AI Act Annex IV documentation generator and evidence pack for teams shipping AI features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub",
    "instructor",
    "openai",
    "pydantic>=2.0",
    "pyyaml",
    "reportlab",
    "typer",
]

[project.scripts]
compliance-copilot = "cli:app"
evidence-pack = "evidence_pack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/annex_iv", "src/ingestion", "src/extraction", "src/gap_analysis", "src/output", "src/evidence_pack", "src", "benchmark"]

[dependency-groups]
dev = [
    "pypdf>=6.12.2",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["benchmark/cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]  # typer.Option defaults are the documented typer pattern
